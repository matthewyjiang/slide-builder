name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 8
  CARGO_INCREMENTAL: 0
  # The embedded renderer makes debug artifacts large; CI does not need symbols.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Rust lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features

  macos:
    name: macOS Obscura lint and isolation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # PR caches are scoped to the PR merge ref. Keep native dependencies
          # after a failed qualification run so policy fixes do not rebuild V8.
          cache-on-failure: true
      - name: Native tool and browser versions
        run: |
          sw_vers
          uname -m
          rustc -Vv
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version
          brew install poppler
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast
      - name: Obscura isolation
        if: ${{ !cancelled() }}
        run: |
          echo "SANDBOX_STARTED_AT=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          cargo test --locked --lib macos_sandbox_blocks_host_files_network_and_services -- --ignored
      - name: Obscura native capture
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --test embedded_render -- --include-ignored
          cargo test --locked --test styled_text_render -- --ignored
      - name: Obscura PDF export
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --test export_pdf obscura_exports -- --ignored
      - name: Explicit Chromium compatibility
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --test chromium_render -- --ignored
          cargo test --locked --test export_pdf chromium_exports -- --ignored
      - name: Sandbox denial diagnostics
        if: failure() && env.SANDBOX_STARTED_AT != ''
        run: |
          sudo log show --info --debug --style compact --start "$SANDBOX_STARTED_AT" --predicate 'process == "sandboxd" OR eventMessage CONTAINS "deny"'
          python3 - <<'PY'
          import json
          from pathlib import Path
          for root in [Path.home() / 'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')]:
              for path in root.glob('*.ips'):
                  if not path.name.startswith(('slide', 'true', 'sandbox-exec')):
                      continue
                  print(path)
                  text = path.read_text()
                  _, end = json.JSONDecoder().raw_decode(text)
                  report = json.loads(text[end:])
                  print('exception:', report.get('exception'))
                  print('termination:', report.get('termination'))
                  print('application information:', report.get('asi'))
                  for thread in report.get('threads', []):
                      if thread.get('triggered'):
                          print('faulting frames:', thread.get('frames'))
          PY
