[package]
name = "slide-builder"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "AI-first terminal PowerPoint builder"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
handler-common = { git = "https://github.com/RainLib/OfficeCli-rust.git", rev = "acabe4959a37235dd587bbcc788565f19a824bb7" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
keyring = "4.1.5"
libc = "0.2"
notify = "8"
pdf-writer = "0.15"
miniz_oxide = "0.8"
tempfile = "3"
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura", rev = "a1e09de68c7617b8079fbb1661b0548c501971c1", features = ["render"] }
obscura-js = { git = "https://github.com/h4ckf0r0day/obscura", rev = "a1e09de68c7617b8079fbb1661b0548c501971c1", features = ["render"] }
pptx-handler = { git = "https://github.com/RainLib/OfficeCli-rust.git", rev = "acabe4959a37235dd587bbcc788565f19a824bb7" }
pulldown-cmark = "0.13"
txm = { version = "0.1.6", default-features = false, features = ["ratatui"] }
syntect = { version = "5", default-features = false, features = ["regex-fancy", "parsing", "dump-load"] }
# The terminal adapter matches this parser's IR; upgrades require renderer snapshot checks.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = "0.37.5"
resvg = { version = "0.47", default-features = false }
svgtypes = "0.16"
ratatui = "0.30.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
rho-sdk = { git = "https://github.com/matthewyjiang/rho.git", rev = "59cdbaa5294a1e93c33187d8ab23a42fb36d7fb0" }
rho-providers = { git = "https://github.com/matthewyjiang/rho.git", rev = "59cdbaa5294a1e93c33187d8ab23a42fb36d7fb0" }
rho-agent-tools = { git = "https://github.com/matthewyjiang/rho.git", rev = "59cdbaa5294a1e93c33187d8ab23a42fb36d7fb0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zeroize = "1"

# Preserve the rendering fixes used by the tested Obscura v0.2.2 release.
[patch.crates-io]
taffy = { git = "https://github.com/h4ckf0r0day/obscura", rev = "a1e09de68c7617b8079fbb1661b0548c501971c1" }
cosmic-text = { git = "https://github.com/h4ckf0r0day/obscura", rev = "a1e09de68c7617b8079fbb1661b0548c501971c1" }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
syntect = { version = "5", default-features = false, features = ["regex-fancy", "parsing", "dump-load", "dump-create", "yaml-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
pretty_assertions = "1"
